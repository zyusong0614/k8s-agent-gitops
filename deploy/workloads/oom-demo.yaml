apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: k8s-agent-demo
  labels:
    app: oom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
        memory_limit: 256Mi
    spec:
      containers:
        - name: app
          image: python:3.11-slim
          command:
            - python
            - -c
            - |
              import sys
              data = []
              max_iterations = 100
              iteration = 0
              while iteration < max_iterations:
                  data.append("x" * 1024 * 1024)
                  iteration += 1
              print("Demo completed successfully", file=sys.stderr)
          resources:
            requests:
              memory: 128Mi
              cpu: 10m
            limits:
              memory: 256Mi
              cpu: 100m
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep python | grep -v grep"
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          restartPolicy: OnFailure