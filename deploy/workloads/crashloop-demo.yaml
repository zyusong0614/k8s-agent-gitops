apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  namespace: k8s-agent-demo
  labels:
    app: crashloop-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-demo
  template:
    metadata:
      labels:
        app: crashloop-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -z "$DEMO_REQUIRED_CONFIG" ]; then
                echo "Error: missing required environment variable DEMO_REQUIRED_CONFIG"
                exit 1
              fi
              echo "Configuration loaded: $DEMO_REQUIRED_CONFIG"
              sleep 3600
          env:
            - name: DEMO_REQUIRED_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: crashloop-demo-config
                  key: required-config
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -n "$DEMO_REQUIRED_CONFIG"
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crashloop-demo-config
  namespace: k8s-agent-demo
data:
  required-config: "default-configuration-value"